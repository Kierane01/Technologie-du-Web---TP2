<!DOCTYPE html>
<head>
    <title>CONVERTISSEUR</title>
    <link href="style.css" rel="stylesheet">
    <meta charset="utf-8">
</head>
<body>
    <table>
        <thead>
            <tr>
                <th scope="col" colspan="3">Convertisseur</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th><img src="https://upload.wikimedia.org/wikipedia/commons/8/8f/Euro_symbol.svg"></th>
                <td>Euros</td>
                <td><input type="text" id="Euro"></td>
            </tr>
            <tr>
                <th><img src="https://upload.wikimedia.org/wikipedia/commons/1/1e/Eye.jpg"></th>
                <td>Dollar Américain</td>
                <td><input type="text" id="Dollar-Americain"></td>
            </tr>
            <tr>
                <th><img src="https://www.changedelabourse.com/291-large_default/dollar-australie-aud.jpg"></th>
                <td>Dollar Australien</td>
                <td><input type="text" id="Dollar-Australien"></td>
            </tr>
        </tbody>
    </table>

    <script src="script.js"></script>
</body>
